<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Spazia posters</title>
<!--
  A4 posters for notice boards. ?p=host | renter | tabs shows one (that's what
  render.mjs prints to PDF and PNG); no parameter shows all three. Sizes are in
  millimetres; text and QR codes keep 10 mm from the edges, for printers that
  can't print to the edge. Prices: src/content/categories.ts (guide prices, fee
  included). 605 kr: half a double garage as on the site (10 tyre sets, 4 ski sets
  and a snowmobile = 700 kr from renters), minus 10 % and 5 % in fees.
-->
<style>
  @font-face { font-family: "Finlandica"; src: url(../ads/assets/finlandica-latin-wght-normal.woff2) format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "Fraunces"; src: url(../ads/assets/fraunces-latin-wght-normal.woff2) format("woff2"); font-weight: 100 900; }
  @page { size: A4; margin: 0; }
  :root {
    --night: #1d3340; --snow: #f6f8f9; --frost: #e8eef1; --frost-2: #c3d0d7; --brand: #2f6b75; --brand-soft: #e4f0f1;
    --glow: #ffc56e; --glow-soft: #fff3dc; --ink: #1e2a31; --muted: #586670; --line: #dfe5e8; --pine: #2f6a55;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: #fff; font-family: "Finlandica", sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body.gallery { background: #8a9aa3; display: flex; flex-wrap: wrap; gap: 10mm; padding: 10mm; }
  .poster { position: relative; width: 210mm; height: 297mm; overflow: hidden; background: #fff; page-break-after: always; }
  h1, h2, .display { font-family: "Fraunces", serif; font-weight: 700; letter-spacing: -0.01em; margin: 0; }
  p { margin: 0; }

  /* Photo with the headline on it */
  .photo { position: absolute; left: 0; right: 0; top: 0; overflow: hidden; }
  .photo .bg { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgb(13 24 31 / .55) 0%, rgb(13 24 31 / .05) 30%, rgb(13 24 31 / .4) 52%, rgb(13 24 31 / .9) 100%); }
  .photo .logo { position: absolute; left: 12mm; top: 11mm; height: 10mm; width: auto; }
  .photo .chip { position: absolute; right: 12mm; top: 12mm; background: var(--glow); color: var(--night); font-weight: 800; font-size: 4.2mm; letter-spacing: .04em; text-transform: uppercase; padding: 2mm 4mm; border-radius: 99mm; }
  .photo .head { position: absolute; left: 12mm; right: 12mm; bottom: 10mm; color: #fff; }
  .photo .eyebrow { font-size: 4.6mm; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--glow); }
  .photo h1 { font-size: 15.5mm; line-height: .98; margin-top: 2.5mm; text-shadow: 0 .6mm 3mm rgb(0 0 0 / .35); }
  .photo .sub { font-size: 6.2mm; line-height: 1.2; margin-top: 3mm; color: #fff; font-weight: 600; }

  .body { position: absolute; left: 12mm; right: 12mm; }

  /* Big number */
  .money { display: flex; align-items: baseline; gap: 3mm; flex-wrap: wrap; }
  .money .lead { font-size: 6mm; font-weight: 600; color: var(--ink); width: 100%; }
  .money .num { font-family: "Fraunces", serif; font-weight: 800; font-size: 25mm; line-height: 1; color: var(--night); letter-spacing: -.03em; }
  .money .num .hl { background: linear-gradient(transparent 62%, var(--glow) 62%); padding: 0 1mm; }
  .money .per { font-size: 7.5mm; font-weight: 700; color: var(--night); }
  .note { font-size: 3.4mm; line-height: 1.35; color: var(--muted); margin-top: 2.5mm; }

  /* Benefits */
  .checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 2.6mm; }
  .checks li { display: flex; gap: 3mm; align-items: flex-start; font-size: 5mm; line-height: 1.22; font-weight: 600; color: var(--ink); }
  .checks svg { width: 6mm; height: 6mm; flex: none; margin-top: .2mm; color: var(--pine); }
  .checks b { color: var(--night); }

  /* Prices */
  .prices { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3mm; }
  .price { border: .4mm solid var(--line); border-radius: 4mm; padding: 3.5mm 3mm; text-align: center; background: var(--snow); }
  .price.hi { background: var(--glow-soft); border-color: var(--glow); }
  .price svg { width: 8mm; height: 8mm; color: var(--brand); }
  .price .what { font-size: 4.2mm; font-weight: 700; color: var(--night); margin-top: 1mm; }
  .price .kr { font-family: "Fraunces", serif; font-weight: 800; font-size: 8.5mm; color: var(--night); line-height: 1.05; margin-top: 1mm; }
  .price .unit { font-size: 3.2mm; color: var(--muted); }

  /* QR row */
  .qrs { position: absolute; left: 12mm; right: 12mm; display: flex; gap: 4mm; align-items: stretch; }
  .qr { display: flex; gap: 4mm; align-items: center; border-radius: 5mm; padding: 3.5mm; }
  .qr img { display: block; background: #fff; border-radius: 2mm; }
  .qr.main { flex: 1.45; background: var(--night); color: #fff; }
  .qr.main img { width: 40mm; height: 40mm; }
  .qr.side { flex: 1; background: var(--brand-soft); color: var(--night); }
  .qr.side img { width: 29mm; height: 29mm; }
  .qr .t1 { font-size: 5.6mm; font-weight: 800; line-height: 1.15; }
  .qr .t2 { font-family: "Fraunces", serif; font-weight: 700; font-size: 5.6mm; margin-top: 1.8mm; color: var(--glow); white-space: nowrap; }
  .qr.side .t1 { font-size: 4.6mm; }
  .qr.side .t2 { font-size: 5mm; color: var(--brand); }
  .qr .t3 { font-size: 3.3mm; line-height: 1.3; margin-top: 1.5mm; opacity: .85; }
  .scan { display: inline-flex; align-items: center; gap: 1.5mm; font-size: 3.4mm; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--glow); margin-bottom: 1.5mm; }
  .qr.side .scan { color: var(--brand); }

  .foot { position: absolute; left: 12mm; right: 12mm; bottom: 9mm; display: flex; justify-content: space-between; align-items: center; font-size: 3.4mm; color: var(--muted); }
  .foot img { height: 7mm; width: auto; }

  /* Three steps */
  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3mm; counter-reset: step; }
  .step { background: var(--snow); border: .4mm solid var(--line); border-radius: 4mm; padding: 3.5mm; counter-increment: step; }
  .step::before { content: counter(step); display: grid; place-items: center; width: 7.5mm; height: 7.5mm; border-radius: 50%; background: var(--night); color: var(--glow); font-family: "Fraunces", serif; font-weight: 800; font-size: 4.4mm; }
  .step b { display: block; font-size: 4.6mm; color: var(--night); margin-top: 2mm; }
  .step span { display: block; font-size: 3.6mm; line-height: 1.3; color: var(--muted); margin-top: .8mm; }

  /* Two sides (tabs poster) */
  .sides { display: grid; grid-template-columns: 1fr 1fr; gap: 4mm; }
  .side { border-radius: 5mm; padding: 5mm; }
  .side.a { background: var(--glow-soft); }
  .side.b { background: var(--brand-soft); }
  .side h2 { font-size: 8mm; line-height: 1.02; color: var(--night); }
  .side p { font-size: 4.3mm; line-height: 1.32; margin-top: 2.2mm; color: var(--ink); }
  .side .big { font-family: "Fraunces", serif; font-weight: 800; font-size: 9mm; color: var(--night); margin-top: 2.5mm; line-height: 1; }
  .side .big small { font-family: "Finlandica", sans-serif; font-size: 3.6mm; font-weight: 700; }

  .pills { display: flex; justify-content: space-between; margin-top: 4.5mm; }
  .pills span { display: inline-flex; align-items: center; gap: 1.6mm; font-size: 4.2mm; font-weight: 700; color: var(--night); }
  .pills svg { width: 5mm; height: 5mm; color: var(--pine); }

  /* Tear-off strips */
  .tabs { position: absolute; left: 0; right: 0; bottom: 0; height: 52mm; border-top: .5mm dashed #9aa8b0; display: grid; grid-template-columns: repeat(8, 1fr); }
  .tabs .cut { position: absolute; left: 12mm; top: -3.4mm; background: #fff; padding: 0 2mm; font-size: 3.4mm; font-weight: 700; color: var(--muted); }
  .tab { border-left: .5mm dashed #9aa8b0; display: flex; align-items: center; justify-content: center; }
  .tab:first-child { border-left: 0; }
  .tab span { writing-mode: vertical-rl; transform: rotate(180deg); text-align: center; line-height: 1.15; }
  .tab b { font-family: "Fraunces", serif; font-size: 5.6mm; color: var(--night); display: block; }
  .tab i { font-style: normal; font-size: 3.2mm; color: var(--ink); font-weight: 600; display: block; }
</style>
</head>
<body>
<script>
  const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" stroke-width="2"/><path d="m7.5 12.5 3 3 6-6.5"/></svg>';
  const ICON = (paths) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${paths}</svg>`;
  const TYRE = '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/>';
  const BOX = '<path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M12 22V12"/><path d="m3.3 7 7.703 4.734a2 2 0 0 0 1.994 0L20.7 7"/><path d="m7.5 4.27 9 5.15"/>';
  const PARK = '<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 17V7h4a3 3 0 0 1 0 6H9"/>';
  const BIKE = '<circle cx="18.5" cy="17.5" r="3.5"/><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="15" cy="5" r="1"/><path d="M12 17.5V14l-3-3 4-3 2 3h2"/>';
  const SCAN = '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 12h10"/></svg>';
  const checks = (items) => `<ul class="checks">${items.map((i) => `<li>${CHECK}<span>${i}</span></li>`).join("")}</ul>`;

  const qrRow = (bottom, main, mainUrl, mainTitle) => `
    <div class="qrs" style="bottom:${bottom}mm">
      <div class="qr main">
        <img src="qr/${main}.svg" alt="QR-kod till ${mainUrl}">
        <div>
          <div class="scan">${SCAN} Skanna med mobilen</div>
          <p class="t1">${mainTitle}</p>
          <p class="t2">${mainUrl}</p>
        </div>
      </div>
      <div class="qr side">
        <img src="qr/instagram.svg" alt="QR-kod till Instagram @_spazia_">
        <div>
          <div class="scan">${SCAN} Instagram</div>
          <p class="t1">Följ oss för nya platser</p>
          <p class="t2">@_spazia_</p>
        </div>
      </div>
    </div>`;

  const POSTERS = {
    // Villa areas, garages, ICA: people with space to spare.
    host: () => `
      <div class="photo" style="height:112mm">
        <img class="bg" src="../ads/photos/garage-night.jpg" alt="" style="object-position:50% 46%">
        <div class="shade"></div>
        <img class="logo" src="../ads/assets/logo-white.svg" alt="Spazia">
        <span class="chip">Gratis att annonsera</span>
        <div class="head">
          <p class="eyebrow">Garage · förråd · källare · p-plats</p>
          <h1>Har du plats över? Låt den tjäna pengar.</h1>
        </div>
      </div>
      <div class="body" style="top:119mm">
        <div class="money">
          <p class="lead">Halva garaget kan ge dig</p>
          <span class="num"><span class="hl">ca 605 kr</span></span><span class="per">i månaden</span>
        </div>
        <p class="note">Exempel: 10 däcksatser, 4 skidpaket och en skoter, efter Spazias avgifter. Du sätter priset själv.</p>
        <div style="margin-top:5mm">${checks([
          "<b>Du bestämmer:</b> vad du tar emot, priset och vem som får hyra",
          "<b>Allt sköts i appen:</b> hyresavtal, betalning och kontakt",
        ])}</div>
        <div class="steps" style="margin-top:5mm">
          <div class="step"><b>Skanna koden</b><span>Skapa konto med Google eller mejl</span></div>
          <div class="step"><b>Lägg upp platsen</b><span>Några bilder, en kort text och ditt pris</span></div>
          <div class="step"><b>Få betalt</b><span>Bankuppgifter först när pengarna väntar</span></div>
        </div>
      </div>
      ${qrRow(24, "host", "spazia.se/bli-vard", "Lägg upp din plats gratis")}
      <div class="foot"><span>Förvaring och parkering hos grannar</span><img src="../ads/assets/logo-color.svg" alt="Spazia"></div>`,

    // Apartment buildings, laundry rooms, student housing: people who need space.
    renter: () => `
      <div class="photo" style="height:122mm">
        <img class="bg" src="../ads/photos/tyres.jpg" alt="" style="object-position:30% 45%">
        <div class="shade"></div>
        <img class="logo" src="../ads/assets/logo-white.svg" alt="Spazia">
        <span class="chip">Ingen bindningstid</span>
        <div class="head">
          <p class="eyebrow">Förvaring och p-plats hos grannar</p>
          <h1>Sommardäcken i hallen igen?</h1>
          <p class="sub">Förvara dem hos en granne i stället. Hämta när du vill.</p>
        </div>
      </div>
      <div class="body" style="top:130mm">
        <div class="prices">
          <div class="price hi">${ICON(TYRE)}<p class="what">Däck</p><p class="kr">30 kr</p><p class="unit">per sats och mån</p></div>
          <div class="price">${ICON(BOX)}<p class="what">Förråd</p><p class="kr">70 kr</p><p class="unit">per m² och mån</p></div>
          <div class="price">${ICON(PARK)}<p class="what">P-plats</p><p class="kr">140 kr</p><p class="unit">per månad</p></div>
          <div class="price">${ICON(BIKE)}<p class="what">Cykel</p><p class="kr">35 kr</p><p class="unit">per månad</p></div>
        </div>
        <p class="note">Ungefärliga priser med avgift. Värden sätter det slutliga priset.</p>
        <div style="margin-top:5.5mm">${checks([
          "<b>Billigare än ett förrådsföretag</b>, och ofta närmare hemmet",
          "<b>Säg upp när du vill.</b> Ingen bindningstid, ingen handpenning",
          "<b>Tryggt:</b> hyresavtal och kortbetalning i appen, och värden får betalt först efter perioden",
        ])}</div>
      </div>
      ${qrRow(24, "site", "spazia.se", "Hitta en plats nära dig")}
      <div class="foot"><span>Däck · flyttlådor · cykel · skoter · bil · p-plats</span><img src="../ads/assets/logo-color.svg" alt="Spazia"></div>`,

    // Shared boards (ICA, libraries, community halls): both sides, with tear-off strips.
    tabs: () => `
      <div class="photo" style="height:108mm">
        <img class="bg" src="photos/house-harads.jpg" alt="" style="object-position:50% 58%">
        <div class="shade"></div>
        <img class="logo" src="../ads/assets/logo-white.svg" alt="Spazia">
        <div class="head">
          <p class="eyebrow">Ny tjänst: förvaring hos grannar</p>
          <h1 style="font-size:14mm">Grannar hyr ut plats till grannar.</h1>
        </div>
      </div>
      <div class="body" style="top:115mm">
        <div class="sides">
          <div class="side a">
            <h2>Har du plats över?</h2>
            <p>Hyr ut ett hörn i garaget, förrådet, källaren eller en p-plats. Gratis att annonsera, du sätter priset.</p>
            <p class="big">ca 605 kr<small> /mån</small></p>
            <p class="note" style="margin-top:1mm">för halva garaget, efter avgifter</p>
          </div>
          <div class="side b">
            <h2>Behöver du plats?</h2>
            <p>Däck, flyttlådor, cykeln, skotern eller bilen. Hos en granne nära dig, utan bindningstid.</p>
            <p class="big">från 30 kr<small> /mån</small></p>
            <p class="note" style="margin-top:1mm">för en däcksats, avgift inräknad</p>
          </div>
        </div>
        <div class="pills">
          <span>${CHECK} Gratis att gå med</span><span>${CHECK} Ingen bindningstid</span><span>${CHECK} Avtal och betalning i appen</span>
        </div>
      </div>
      ${qrRow(58, "site", "spazia.se", "Hyr ut eller hitta plats")}
      <div class="tabs">
        <span class="cut">✂ Riv av en lapp</span>
        ${Array.from({ length: 8 }, () => `<div class="tab"><span><b>spazia.se</b><i>förvaring hos grannar</i></span></div>`).join("")}
      </div>`,
  };

  const q = new URLSearchParams(location.search);
  const render = (id) => `<div class="poster" id="${id}">${POSTERS[id]()}</div>`;
  if (q.get("p")) document.body.insertAdjacentHTML("beforeend", render(q.get("p")));
  else {
    document.body.className = "gallery";
    for (const id of Object.keys(POSTERS)) document.body.insertAdjacentHTML("beforeend", render(id));
  }
</script>
</body>
</html>
