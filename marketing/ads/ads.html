<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Spazia ads</title>
<!--
  Image ads for Instagram and Facebook. Open with ?ad=<id>&size=<feed|story>
  to see one ad at full size (that's what render.mjs screenshots), or with no
  parameters to see all of them side by side. Text lives in ADS below.
-->
<style>
  @font-face { font-family: "Finlandica"; src: url(assets/finlandica-latin-wght-normal.woff2) format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "Fraunces"; src: url(assets/fraunces-latin-wght-normal.woff2) format("woff2"); font-weight: 100 900; }

  :root {
    --night: #1d3340; --night-2: #26404f; --snow: #f6f8f9; --frost: #e8eef1; --frost-2: #c3d0d7;
    --brand: #2f6b75; --bright: #3f7c86; --brand-soft: #e4f0f1; --glow: #ffc56e; --glow-soft: #fff3dc;
    --ink: #1e2a31; --muted: #586670; --line: #dfe5e8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #0b141a; }
  body.gallery { display: flex; flex-wrap: wrap; gap: 40px; padding: 40px; align-items: flex-start; }
  body.gallery .frame { width: 432px; overflow: hidden; border-radius: 12px; }
  body.gallery .frame .ad { transform: scale(0.4); transform-origin: 0 0; margin-bottom: calc(var(--h) * -0.6); }

  /* Sizes. --top/--bottom keep text out of the parts Instagram covers (Stories: profile row at the top, reply bar at the bottom). */
  .ad { position: relative; width: 1080px; height: var(--h); overflow: hidden; font-family: "Finlandica", sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
  .feed { --h: 1350px; --top: 84px; --bottom: 84px; --side: 84px; }
  .story { --h: 1920px; --top: 260px; --bottom: 380px; --side: 84px; }

  .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .layer { position: absolute; inset: 0; }
  h1, .display { font-family: "Fraunces", serif; font-weight: 700; letter-spacing: -0.015em; margin: 0; }
  p { margin: 0; }
  .eyebrow { font-size: 30px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--glow); }
  .foot { display: flex; align-items: center; justify-content: space-between; }
  .logo { height: 58px; width: auto; display: block; }
  .url { font-size: 34px; font-weight: 600; }

  /* ---------- Tyres (renters) ---------- */
  .tyres .bg { object-position: 32% 30%; }
  .tyres .shade { background: linear-gradient(180deg, rgb(29 51 64 / 0.15) 0%, rgb(29 51 64 / 0) 22%, rgb(29 51 64 / 0.55) 42%, rgb(29 51 64 / 0.94) 56%, var(--night) 70%); }
  .tyres .content { position: absolute; left: var(--side); right: var(--side); bottom: var(--bottom); }
  .tyres h1 { font-size: 112px; line-height: 0.98; margin-top: 22px; }
  .story.tyres h1 { font-size: 124px; }
  .tyres .lead { font-size: 44px; line-height: 1.25; color: var(--frost); margin-top: 30px; max-width: 860px; }
  .tyres .foot { margin-top: 56px; padding-top: 40px; border-top: 2px solid rgb(255 255 255 / 0.16); }
  .sticker { position: absolute; right: var(--side); top: var(--top); width: 290px; height: 290px; border-radius: 50%; background: var(--glow); color: var(--night);
             display: flex; flex-direction: column; align-items: center; justify-content: center; transform: rotate(-8deg); box-shadow: 0 18px 50px rgb(0 0 0 / 0.35); }
  .sticker .s1 { font-size: 34px; font-weight: 600; line-height: 1; }
  .sticker .s2 { font-family: "Fraunces", serif; font-weight: 800; font-size: 96px; line-height: 1; letter-spacing: -0.03em; margin: 6px 0 4px; }
  .sticker .s3 { font-size: 32px; font-weight: 600; line-height: 1; }
  .story .sticker { top: calc(var(--top) + 20px); width: 320px; height: 320px; }
  .story .sticker .s2 { font-size: 108px; }

  /* ---------- Garage (hosts) ---------- */
  .host .bg { object-position: 50% 0%; }
  .host .shade { background: linear-gradient(180deg, rgb(13 24 31 / 0.55) 0%, rgb(13 24 31 / 0) 34%, rgb(13 24 31 / 0) 60%, rgb(13 24 31 / 0.6) 74%, rgb(13 24 31 / 0.92) 100%); }
  .host .top { position: absolute; left: var(--side); right: var(--side); top: var(--top); text-align: center; }
  .host h1 { font-size: 76px; line-height: 1.05; margin-top: 18px; }
  .host .big { font-family: "Fraunces", serif; font-weight: 800; font-size: 178px; line-height: 0.95; letter-spacing: -0.035em; color: var(--glow); margin-top: 14px; }
  .host .big small { font-size: 0.4em; letter-spacing: 0; font-weight: 700; }
  .host .big .ca { vertical-align: 0.95em; margin-right: 0.18em; }
  .host .big .per { margin-left: 0.1em; color: #fff; }
  .story.host .big { font-size: 184px; }
  .host .content { position: absolute; left: var(--side); right: var(--side); bottom: var(--bottom); }
  .host .lead { font-size: 36px; line-height: 1.3; color: var(--frost); text-align: center; max-width: 820px; margin: 0 auto; }
  .host .foot { margin-top: 44px; padding-top: 38px; border-top: 2px solid rgb(255 255 255 / 0.16); }
  .host .url b { color: var(--glow); font-weight: 700; }

  /* ---------- Price list (both) ---------- */
  .prices { background: var(--snow); color: var(--ink); }
  .prices .inner { position: absolute; left: var(--side); right: var(--side); top: var(--top); bottom: var(--bottom); display: flex; flex-direction: column; }
  .prices .head { display: flex; align-items: center; justify-content: space-between; }
  .prices .logo { height: 54px; }
  .prices .pill { font-size: 26px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--brand); background: var(--brand-soft); padding: 12px 22px; border-radius: 999px; }
  .prices h1 { font-size: 80px; line-height: 1.02; color: var(--night); margin-top: 44px; white-space: nowrap; }
  .prices .sub { font-size: 34px; color: var(--muted); margin-top: 18px; }
  .prices ul { list-style: none; margin: 34px 0 0; padding: 0; border-top: 2px solid var(--line); }
  .prices li { display: flex; align-items: center; gap: 26px; padding: 0 6px; height: var(--row); border-bottom: 2px solid var(--line); }
  .feed.prices { --row: 98px; }
  .story.prices { --row: 124px; }
  .prices li svg { width: 50px; height: 50px; flex: none; color: var(--brand); }
  .prices li .name { font-size: 38px; font-weight: 600; color: var(--night); }
  .prices li .unit { font-size: 30px; color: var(--muted); margin-left: 10px; }
  .prices li .price { margin-left: auto; font-family: "Fraunces", serif; font-weight: 700; font-size: 46px; color: var(--night); white-space: nowrap; }
  .prices li.hi { background: var(--glow-soft); border-radius: 18px; border-bottom-color: transparent; margin: -2px -6px 0; padding: 0 12px; }
  .prices .note { font-size: 30px; line-height: 1.35; color: var(--muted); margin-top: 26px; }
  .prices .foot { margin-top: auto; }
  .prices .url { color: var(--brand); font-size: 44px; font-weight: 700; }
  .prices .tag { font-size: 32px; font-weight: 600; color: var(--night); }
</style>
</head>
<body>
<script src="assets/icons.js"></script>
<script>
  const LOGO_WHITE = '<img class="logo" src="assets/logo-white.svg" alt="Spazia">';
  const LOGO_COLOR = '<img class="logo" src="assets/logo-color.svg" alt="Spazia">';
  const icon = (id) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">${ICONS[id]}</svg>`;

  // Guide prices from src/content/categories.ts (per month, Spazia's fee included).
  const PRICES = [
    ["tyres", "Däck", "per sats", 30],
    ["boxes", "Lådor & möbler", "per m²", 70],
    ["skis", "Skidor", "per paket", 55],
    ["bikes", "Cykel", "", 35],
    ["parking", "P-plats", "", 140],
    ["snowmobile", "Skoter & släp", "", 180],
    ["car", "Bil inomhus", "", 320],
  ];

  const ADS = {
    // Renters: the summer tyres just came off.
    tyres: () => `
      <img class="bg" src="photos/tyres.jpg" alt="">
      <div class="layer shade"></div>
      <div class="sticker"><span class="s1">ca</span><span class="s2">30&nbsp;kr</span><span class="s3">i månaden</span></div>
      <div class="content">
        <p class="eyebrow">Däckförvaring i Luleå</p>
        <h1>Sommardäcken i&nbsp;hallen igen?</h1>
        <p class="lead">Förvara dem hos en granne och hämta dem när du vill. Ingen bindningstid.</p>
        <div class="foot">${LOGO_WHITE}<span class="url">spazia.se</span></div>
      </div>`,

    // Hosts. Half a double garage, as on the site (exampleGarageIncome): 10 tyre sets at 30 kr, 4 ski sets at 55 kr
    // and a snowmobile at 180 kr is 700 kr from renters; minus the 10 % renter fee and the 5 % host fee ≈ 605 kr.
    host: () => `
      <img class="bg" src="photos/garage-night.jpg" alt="">
      <div class="layer shade"></div>
      <div class="top">
        <p class="eyebrow">Har du ett garage i Luleå?</p>
        <h1>Halva garaget kan ge</h1>
        <p class="big"><small class="ca">ca</small>605&nbsp;kr<small class="per">/mån</small></p>
      </div>
      <div class="content">
        <p class="lead">Räknat på 10 däcksatser, 4 skidpaket och en skoter, efter Spazias avgifter. Du sätter priset själv.</p>
        <div class="foot">${LOGO_WHITE}<span class="url">Hyr ut på <b>spazia.se</b></span></div>
      </div>`,

    // Both sides: what things cost.
    prices: () => `
      <div class="inner">
        <div class="head">${LOGO_COLOR}<span class="pill">Luleå</span></div>
        <h1>Förvaring hos grannar</h1>
        <p class="sub">Riktpriser per månad, avgift inräknad</p>
        <ul>${PRICES.map(([id, name, unit, kr], i) => `
          <li class="${i === 0 ? "hi" : ""}">${icon(id)}<span class="name">${name}</span>${unit ? `<span class="unit">${unit}</span>` : ""}<span class="price">ca ${kr} kr</span></li>`).join("")}
        </ul>
        <p class="note">Värden sätter priset. Ingen bindningstid.</p>
        <div class="foot"><span class="tag">Hitta plats eller hyr ut din egen</span><span class="url">spazia.se</span></div>
      </div>`,
  };

  const q = new URLSearchParams(location.search);
  const render = (id, size) => `<div class="ad ${size} ${id}" id="ad">${ADS[id]()}</div>`;
  if (q.get("ad")) {
    document.body.insertAdjacentHTML("beforeend", render(q.get("ad"), q.get("size") || "feed"));
  } else {
    document.body.className = "gallery";
    for (const id of Object.keys(ADS)) for (const size of ["feed", "story"])
      document.body.insertAdjacentHTML("beforeend", `<div class="frame">${render(id, size)}</div>`);
  }
</script>
</body>
</html>
