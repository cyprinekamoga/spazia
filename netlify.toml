[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# Short addresses for ads and posters
[[redirects]]
  from = "/parkering"
  to = "/forvaring/parkering"
  status = 301

[[redirects]]
  from = "/en/parking"
  to = "/en/storage/parking"
  status = 301

# Long-lived caching for hashed build assets.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
