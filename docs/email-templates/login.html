<div style="margin:0;padding:24px 12px;background:#f6f8f9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1e2a31">
  <div style="max-width:520px;margin:0 auto;background:#ffffff;border:1px solid #dfe5e8;border-radius:16px;padding:28px 24px">
    <p style="margin:0 0 20px;font-size:22px;font-weight:700;color:#2f6b75">Spazia</p>
    <p style="margin:0 0 10px;font-size:16px;line-height:1.5">Din kod för att logga in:</p>
    <p style="margin:0 0 20px;font-size:32px;font-weight:700;letter-spacing:8px;color:#1e2a31">{{ .Token }}</p>
    <p style="margin:0 0 14px;font-size:16px;line-height:1.5">Skriv in koden på sidan där du loggar in, eller klicka på knappen:</p>
    <p style="margin:0 0 22px"><a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#2f6b75;color:#ffffff;text-decoration:none;font-weight:700;font-size:16px;padding:12px 20px;border-radius:999px">Logga in på Spazia</a></p>
    <p style="margin:0;font-size:14px;line-height:1.5;color:#586670">Koden och länken gäller i en timme. Har du inte bett om att logga in kan du strunta i det här mejlet.</p>
  </div>
</div>
